[project]
name = "postwarden"
version = "1.0.0"
description = "Postfix milter for protected recipients, self-senders and SPF/DKIM sender authentication"
requires-python = ">=3.11"
license = { file = "LICENSE" }
# Runtime dependencies come from Debian packages (python3-milter, python3-spf, python3-dkim,
# python3-dnspython); no pip installation is used on hosts.
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["postwarden"]
