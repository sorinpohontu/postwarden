name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  draft:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches version and changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          package=$(PYTHONPATH=src python3 -c 'import postwarden; print(postwarden.__version__)')
          if [ "$version" != "$package" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ $package"; exit 1
          fi
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/      { exit }
            found                  { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for [$version]"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build reproducible archive
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          python3 scripts/build-release.py
          if tar -xOzf "dist/postwarden-$VERSION.tar.gz" MANIFEST.sha256 | grep -q -- '-dirty$'; then
            echo "::error::archive built from a tree that differs from the tag"; exit 1
          fi
          cat "dist/postwarden-$VERSION.tar.gz.sha256"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/postwarden-$VERSION.tar.gz" "dist/postwarden-$VERSION.tar.gz.sha256" \
            --draft --verify-tag --title "postwarden $VERSION" --notes-file release-notes.md
